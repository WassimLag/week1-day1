<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Demo 1</title>
    <style>
       header {
        background-image: url('images/central_park.jpg');
        height: 300px;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
    }
    h1 {
        font-size: 3em;
        color: #fff;
        padding-top: 100px;
        text-align: center;
    }

    nav ul {
        list-style-type: none;
        display: flex;
        justify-content: center;
    }

    nav ul li {
        margin: 0 15px;
    }

    nav ul li a {
        text-decoration: none;
        color: #fff;
    }

    nav ul li a:hover {
        text-decoration: underline;
    }
    footer {
        background-color: #333;
        color: #fff;
        text-align: center;
        padding: 20px 0;
    }

    main h1 {
        color: #333;
    }

    main {
        padding: 20px;
    }
    </style>
    
</head>
<body>
    <div id="container">
        <header>
            <h1>Welcome to My Website</h1>
        </header>
        <nav>
            <a href="index.html">Home</a> |
            <a href="page2.html">Services</a> |
            <a href="page3.html">Contact Us</a>
        </nav>
        
        <main>
            <section>
                <h2>Main Content Section</h2>
                <p>This is the main content area of the webpage.</p> 

            </section>
        </main>
        <footer>
            <p>&copy; 2024 My Website. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
