<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Page 3</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div id="container">
        <header>
            <h1>Contact Us</h1>
        </header>
        <nav>
            <a href="index.html">Home</a> |
            <a href="page2.html">Services</a> |
            <a href="page3.html">Contact Us</a>
            <a href="page4.html">Gallery</a>
        </nav>
        
        <main>
            <section>
                <h2>Get in Touch</h2>
                <p>Feel free to reach out to us using the form below.</p>
                <form action="#" method="post">
                    <fieldset>
                        <legend>Sign Up</legend>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name"><br>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email"><br>
                        <label for="phone">Phone:</label>
                        <input type="tel" id="phone" name="phone"><br>
                        <label>Gender:</label>
                        <input type="radio" id="male" name="gender" value="male"> Male
                        <input type="radio" id="female" name="gender" value="female"> Female<br>
                        <label for="contact">Preferred Contact Method:</label>
                        <select id="contact" name="contact">
                            <option value="email">Email</option>
                            <option value="phone">Phone</option>
                        </select><br>
                        <label for="comments">Comments:</label><br>
                        <textarea id="comments" name="comments" rows="4" cols="50"></textarea><br>
                        <button type="submit">Submit</button>
                    </fieldset>
                </form>
            </section>
        </main>
        <footer>
            <p>&copy; 2024 Our Company. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
